<h2>CRUD - Groups</h2>

<button pButton label="Agregar Group" icon="pi pi-plus" (click)="openNew()"></button>

<p-table [value]="groups" class="mt-3">
  <ng-template pTemplate="header">
    <tr>
      <th>Nombre</th>
      <th>Nivel</th>
      <th>Autor</th>
      <th>Integrantes</th>
      <th>Tickets</th>
      <th>Acciones</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-group>
    <tr>
      <td>{{ group.nombre }}</td>
      <td>{{ group.nivel }}</td>
      <td>{{ group.autor }}</td>
      <td>{{ group.integrantes }}</td>
      <td>{{ group.tickets }}</td>
      <td>
        <button pButton icon="pi pi-pencil" class="p-button-text"
          (click)="editGroup(group)"></button>
        <button pButton icon="pi pi-trash" class="p-button-text p-button-danger"
          (click)="deleteGroup(group)"></button>
      </td>
    </tr>
  </ng-template>
</p-table>

<!-- MODAL -->
<p-dialog header="Group" [(visible)]="dialogVisible" [modal]="true" [style]="{width:'400px'}">

  <div class="p-fluid">

    <input pInputText [(ngModel)]="currentGroup.nombre" placeholder="Nombre" />
    <input pInputText [(ngModel)]="currentGroup.nivel" placeholder="Nivel" />
    <input pInputText [(ngModel)]="currentGroup.autor" placeholder="Autor" />
    <input pInputText type="number" [(ngModel)]="currentGroup.integrantes" placeholder="Integrantes" />
    <input pInputText type="number" [(ngModel)]="currentGroup.tickets" placeholder="Tickets" />
    <input pInputText [(ngModel)]="currentGroup.descripcion" placeholder="Descripción" />

  </div>

  <ng-template pTemplate="footer">
    <button pButton label="Cancelar" class="p-button-text"
      (click)="dialogVisible=false"></button>
    <button pButton label="Guardar" (click)="saveGroup()"></button>
  </ng-template>

</p-dialog>
