<p-toast></p-toast>

<div class="auth-bg">
  <div class="auth-card">
    <div class="auth-stack">
      <button
        type="button"
        class="login-logo"
        aria-label="Logo del login"
        (click)="onLogoClick()">
        ERP
      </button>

      <h2 class="auth-title">Iniciar sesión</h2>

      <input
        pInputText
        type="text"
        placeholder="Correo electrónico"
        [(ngModel)]="usuario"
      />

      <p-password
        [(ngModel)]="password"
        placeholder="Contraseña"
        [toggleMask]="true">
      </p-password>

      <p-button
        class="auth-btn"
        [label]="loading ? 'Entrando...' : 'Entrar'"
        severity="info"
        [disabled]="!canLogin"
        (onClick)="login()">
      </p-button>

      <a class="auth-link" routerLink="/auth/register">
        No tengo cuenta → Registrarme
      </a>

      <small class="auth-demo">
        Demo API:<br>
        <b>admin@marher.com</b> / <b>Demo#12345</b><br>
        <b>dev@marher.com</b> / <b>Demo#12345</b>
      </small>
    </div>
  </div>
</div>
