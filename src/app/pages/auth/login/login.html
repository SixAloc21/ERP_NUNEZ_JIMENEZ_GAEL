<p-toast></p-toast>

<div class="auth-bg">
  <div class="auth-card">
    <div class="auth-stack">
      <h2 class="auth-title">Iniciar sesión</h2>

      <input pInputText type="text" placeholder="Usuario" [(ngModel)]="usuario" />

      <p-password
        [(ngModel)]="password"
        placeholder="Contraseña"
        [toggleMask]="true">
      </p-password>

      <p-button
        class="auth-btn"
        label="Entrar"
        severity="info"
        [disabled]="!canLogin"
        (onClick)="login()">
      </p-button>

      <a class="auth-link" routerLink="/auth/register">No tengo cuenta → Registrarme</a>

      <small class="auth-demo">Demo: usuario <b>Gael</b> / pass <b>Gael!2004##</b></small>
    </div>
  </div>
</div>
